name: Deploy acapella site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "audio-inventory.json"
      - "scripts/check-pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate catalog and original recordings
        run: python3 scripts/check-pages.py site audio-inventory.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated site
        id: deployment
        uses: actions/deploy-pages@v4
